[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "clause-ledger"
version = "0.1.0"
description = "Citation-first local contract evidence retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "scikit-learn>=1.4,<2"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["clauseledger*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
